<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgriControl Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #eef2ec;
    --bg-accent: #e4ede4;
    --panel: #ffffff;
    --panel-border: rgba(24, 42, 47, 0.08);
    --ink: #16262b;
    --muted: #62767b;
    --line: #dfe7e2;
    --teal: #1c6b74;
    --teal-soft: #e3f1f1;
    --amber: #b3711f;
    --amber-soft: #fdf1de;
    --blue: #2f5fa8;
    --blue-soft: #e8eefa;
    --purple: #6a4d9c;
    --purple-soft: #efe9f7;
    --green: #2f7d4a;
    --green-soft: #e4f4e8;
    --red: #ad3b40;
    --red-soft: #faeaea;
    --shadow: 0 1px 2px rgba(16, 30, 33, 0.06), 0 8px 24px -12px rgba(16, 30, 33, 0.18);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1614;
      --bg-accent: #131b19;
      --panel: #182422;
      --panel-border: rgba(255, 255, 255, 0.08);
      --ink: #eaf2ee;
      --muted: #93a7a1;
      --line: #26332f;
      --teal: #5fc2c9;
      --teal-soft: #16302f;
      --amber: #e4a75c;
      --amber-soft: #322717;
      --blue: #8fb3ec;
      --blue-soft: #182236;
      --purple: #c1a8ec;
      --purple-soft: #251d34;
      --green: #7fd39a;
      --green-soft: #16301f;
      --red: #f0999c;
      --red-soft: #341a1b;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 480px at 12% -10%, var(--bg-accent), transparent),
      var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    padding: 28px 20px 60px;
  }
  a { color: var(--teal); }
  code {
    background: var(--panel-border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.85em;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
  }

  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 20px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 {
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--teal), var(--green));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex: none;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
  }
  @media (max-width: 620px) {
    body { padding: 20px 14px 48px; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 20px 20px 22px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent, var(--teal));
  }
  .panel--climate { --accent: var(--amber); }
  .panel--actuators { --accent: var(--purple); }
  .panel--events { --accent: var(--muted); }

  .panel h2 {
    font-size: 0.95rem;
    font-weight: 700;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    letter-spacing: -0.005em;
  }
  .panel h2 .icon {
    width: 18px;
    height: 18px;
    color: var(--accent, var(--teal));
    flex: none;
  }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 8px;
    font: inherit;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus, .btn:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 1px;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent, var(--teal)); }
  input[type="checkbox"] { accent-color: var(--accent, var(--teal)); }
  .row { margin-bottom: 13px; }
  .row:last-child { margin-bottom: 0; }
  .inline-checkbox { display: flex; align-items: center; gap: 6px; font-size: 0.88rem; color: var(--ink); }
  .inline-checkbox + .inline-checkbox { margin-top: 8px; }

  .btn {
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font: inherit;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.92; }
  .btn:active { transform: translateY(1px); }
  .btn.secondary { background: var(--bg-accent); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

  .temp-value { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
  .temp-value .unit { font-size: 1rem; font-weight: 600; color: var(--muted); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 999px;
    padding: 3px 11px;
    font-size: 0.76rem;
    font-weight: 700;
  }
  .badge.ok { background: var(--green-soft); color: var(--green); }
  .badge.warn { background: var(--amber-soft); color: var(--amber); }
  .badge.err { background: var(--red-soft); color: var(--red); }
  .badge.idle { background: var(--bg-accent); color: var(--muted); }

  .response-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
    margin: 14px 0 0;
    font-size: 0.86rem;
  }
  .response-grid dt { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
  .response-grid dd { margin: 0; font-weight: 700; }

  .window-scene {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 0 18px;
  }
  .window-frame {
    width: 112px;
    height: 78px;
    border: 4px solid var(--ink);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #cfe9ec, #e8f4e8);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark) {
    .window-frame { background: linear-gradient(180deg, #223b3d, #1c2f27); }
  }
  .window-sash {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(120, 150, 152, 0.55);
    border-right: 3px solid var(--ink);
    transform-origin: left center;
    transition: transform 0.4s ease;
    backdrop-filter: blur(1px);
  }
  .actuator-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    font-size: 0.88rem;
  }
  .actuator-row + .actuator-row { border-top: 1px solid var(--line); }
  .fan-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    flex: none;
  }
  .fan-indicator.on { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .fan-indicator.off { background: var(--line); }

  ul#eventLog {
    list-style: none;
    margin: 14px 0 0;
    padding: 0;
    max-height: 320px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  ul#eventLog li {
    display: flex;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--bg);
    border-left: 3px solid var(--line);
  }
  ul#eventLog li.tone-good { border-left-color: var(--green); }
  ul#eventLog li.tone-bad { border-left-color: var(--red); }
  .event-body { flex: 1; min-width: 0; }
  .event-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .event-label { font-weight: 700; font-size: 0.86rem; }
  ul#eventLog li.tone-good .event-label { color: var(--green); }
  ul#eventLog li.tone-bad .event-label { color: var(--red); }
  .event-time { color: var(--muted); font-size: 0.74rem; flex: none; white-space: nowrap; }
  ul#eventLog li.empty-state {
    justify-content: center;
    border-left: none;
    background: transparent;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 26px 0;
  }

  .reasons { font-size: 0.82rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }

  .full-width { grid-column: 1 / -1; }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1>
          <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69s6 6.13 6 10.19a6 6 0 1 1-12 0c0-4.06 6-10.19 6-10.19Z"/></svg>
          </span>
          AgriControl Simulator
        </h1>
      </div>
    </div>

    <div class="grid">
      <section class="panel panel--climate" id="sensorsPanel">
        <h2>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
          Sensors
        </h2>
        <div class="row">
          <label for="temperatureSlider">Temperature</label>
          <input type="range" id="temperatureSlider" min="-10" max="50" step="0.5" value="25" />
          <div class="temp-value"><span id="temperatureValue">25.0</span><span class="unit">&deg;C</span></div>
        </div>
        <div class="row">
          <label for="soilMoistureSlider">Soil moisture <span id="soilMoistureValue">45</span>%</label>
          <input type="range" id="soilMoistureSlider" min="0" max="100" step="1" value="45" />
        </div>
        <div class="row">
          <label for="tankLevelSlider">Tank level <span id="tankLevelValue">70</span>%</label>
          <input type="range" id="tankLevelSlider" min="0" max="100" step="1" value="70" />
        </div>
        <label class="inline-checkbox" style="margin-bottom: 14px;">
          <input type="checkbox" id="rainToggle" /> Raining now
        </label>
        <div class="btn-row">
          <button class="btn" id="sendBtn" type="button">Send to ESP</button>
        </div>
      </section>

      <section class="panel panel--actuators" id="actuatorsPanel">
        <h2>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>
          Actuators
        </h2>
        <span class="badge idle" id="responseBadge">No response yet</span>
        <div class="window-scene">
          <div class="window-frame">
            <div class="window-sash" id="windowSash" style="transform: rotateY(0deg);"></div>
          </div>
        </div>
        <div class="actuator-row">
          <span class="fan-indicator off" id="fanIndicator"></span>
          <span id="fanLabel">Fan: off</span>
        </div>
        <div class="actuator-row">
          <span class="fan-indicator off" id="pumpIndicator"></span>
          <span id="pumpLabel">Pump: off</span>
        </div>
        <dl class="response-grid" id="responseGrid"></dl>
        <div class="reasons" id="responseReasons"></div>
      </section>

      <section class="panel panel--events full-width" id="eventLogPanel">
        <h2>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          Event log
        </h2>
        <div class="btn-row">
          <button class="btn secondary" id="refreshEventsBtn" type="button">Refresh</button>
        </div>
        <ul id="eventLog"></ul>
      </section>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // The bridge this page talks to -- not user-configurable, so the
      // page works immediately with no setup for anyone opening it.
      const BRIDGE_URL = "https://phyowaisoe.com/agricontrol/bridge";

      const elements = {
        temperatureSlider: document.getElementById("temperatureSlider"),
        temperatureValue: document.getElementById("temperatureValue"),
        sendBtn: document.getElementById("sendBtn"),
        responseBadge: document.getElementById("responseBadge"),
        responseGrid: document.getElementById("responseGrid"),
        responseReasons: document.getElementById("responseReasons"),
        windowSash: document.getElementById("windowSash"),
        fanIndicator: document.getElementById("fanIndicator"),
        fanLabel: document.getElementById("fanLabel"),
        pumpIndicator: document.getElementById("pumpIndicator"),
        pumpLabel: document.getElementById("pumpLabel"),
        refreshEventsBtn: document.getElementById("refreshEventsBtn"),
        eventLog: document.getElementById("eventLog"),
        soilMoistureSlider: document.getElementById("soilMoistureSlider"),
        soilMoistureValue: document.getElementById("soilMoistureValue"),
        tankLevelSlider: document.getElementById("tankLevelSlider"),
        tankLevelValue: document.getElementById("tankLevelValue"),
        rainToggle: document.getElementById("rainToggle")
      };

      function bridgeUrl() {
        return BRIDGE_URL;
      }

      function setBadge(el, text, tone) {
        el.textContent = text;
        el.className = "badge " + tone;
      }

      // Roadmap task 46: virtual window. 10deg (closed) -> 0% open,
      // 170deg (fully open) -> 100% open, matching
      // logic/decision.py / firmware/include/decision.h's angle range.
      function updateWindowVisual(windowAngleDeg, fanOn, pumpOn) {
        const minDeg = 10;
        const maxDeg = 170;
        const clamped = Math.max(minDeg, Math.min(maxDeg, windowAngleDeg));
        const openFraction = (clamped - minDeg) / (maxDeg - minDeg);
        const rotation = openFraction * 110; // degrees of visual swing
        elements.windowSash.style.transform = `rotateY(${rotation}deg)`;

        elements.fanIndicator.className = "fan-indicator " + (fanOn ? "on" : "off");
        elements.fanLabel.textContent = "Fan: " + (fanOn ? "on" : "off");

        elements.pumpIndicator.className = "fan-indicator " + (pumpOn ? "on" : "off");
        elements.pumpLabel.textContent = "Pump: " + (pumpOn ? "on" : "off");
      }

      function renderResponse(body) {
        setBadge(elements.responseBadge, body.mode || "unknown", body.mode === "automatic" ? "ok" : "warn");
        elements.responseGrid.innerHTML = "";
        const rows = [
          ["Sequence", body.sequence],
          ["Alarm level", body.alarm_level],
          ["Fan", body.commands && body.commands.fan ? "on" : "off"],
          ["Pump", body.commands && body.commands.pump ? "on" : "off"],
          ["Window angle", body.commands ? body.commands.window_angle + "°" : "-"]
        ];
        for (const [label, value] of rows) {
          const dt = document.createElement("dt");
          dt.textContent = label;
          const dd = document.createElement("dd");
          dd.textContent = value === undefined || value === null ? "-" : String(value);
          elements.responseGrid.appendChild(dt);
          elements.responseGrid.appendChild(dd);
        }
        elements.responseReasons.textContent = (body.reasons || []).join(" ");
        if (body.commands) {
          updateWindowVisual(body.commands.window_angle, Boolean(body.commands.fan), Boolean(body.commands.pump));
        }
      }

      function renderError(message) {
        setBadge(elements.responseBadge, "Error", "err");
        elements.responseGrid.innerHTML = "";
        elements.responseReasons.textContent = message;
      }

      // Roadmap tasks 49-51: build the request body. Always sends all
      // four values -- a common user has no reason to selectively omit
      // a reading, that "unavailable reading" edge case is exercised at
      // the backend/firmware test level instead (see
      // backend/tests/test_app.py's TestIrrigationFields).
      function buildSensorPayload() {
        return {
          temperature: parseFloat(elements.temperatureSlider.value),
          soil_moisture: parseFloat(elements.soilMoistureSlider.value),
          water_level_percent: parseFloat(elements.tankLevelSlider.value),
          rain: elements.rainToggle.checked ? 1 : 0
        };
      }

      async function sendTemperature() {
        try {
          const res = await fetch(bridgeUrl() + "/api/temperature", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(buildSensorPayload())
          });
          const body = await res.json();
          if (!res.ok) {
            renderError(body.detail || "Request failed");
            return;
          }
          renderResponse(body);
        } catch (error) {
          renderError("Could not reach the bridge: " + error.message);
        }
        refreshEvents();
      }

      // Translates the bridge's internal event codes (backend/app.py's
      // EventLog) into plain language -- a common user has no reason to
      // know what "ESP_REJECTED" means. Falls back to the raw code for
      // anything not in this list, so a future backend event code still
      // shows up rather than disappearing.
      const EVENT_LABELS = {
        SENT: "Reading sent",
        ACCEPTED: "Accepted",
        ESP_REJECTED: "Rejected by device",
        ESP_UNREACHABLE: "Device unreachable",
        ACTUATOR_FEEDBACK_SIMULATED: "Fault simulated",
        SESSION_RESET: "Session reset"
      };

      function eventLabel(code) {
        return EVENT_LABELS[code] || code;
      }

      // Codes ending in these suffixes are shown with a red accent;
      // ACCEPTED-style codes get a green accent; everything else stays
      // neutral. Purely presentational -- does not change what data is
      // fetched or stored, only how the existing event log is displayed.
      function eventTone(code) {
        if (/REJECTED|UNREACHABLE|ERROR/.test(code)) return "bad";
        if (/ACCEPTED/.test(code)) return "good";
        return "neutral";
      }

      function buildEventRow(item) {
        const li = document.createElement("li");
        li.className = "tone-" + eventTone(item.code);

        const body = document.createElement("div");
        body.className = "event-body";

        const top = document.createElement("div");
        top.className = "event-top";

        const label = document.createElement("span");
        label.className = "event-label";
        label.textContent = eventLabel(item.code);
        top.appendChild(label);

        const time = document.createElement("span");
        time.className = "event-time";
        time.textContent = new Date(item.timestamp_ms).toLocaleTimeString();
        top.appendChild(time);

        body.appendChild(top);

        li.appendChild(body);
        return li;
      }

      async function refreshEvents() {
        try {
          const res = await fetch(bridgeUrl() + "/api/events?limit=20");
          const items = await res.json();
          elements.eventLog.innerHTML = "";
          if (items.length === 0) {
            const empty = document.createElement("li");
            empty.className = "empty-state";
            empty.textContent = "No events yet.";
            elements.eventLog.appendChild(empty);
            return;
          }
          for (const item of items) {
            elements.eventLog.appendChild(buildEventRow(item));
          }
        } catch (error) {
          // Bridge unreachable; leave the existing log as-is rather than
          // clearing it, so a transient blip doesn't erase history.
        }
      }

      elements.temperatureSlider.addEventListener("input", () => {
        elements.temperatureValue.textContent = parseFloat(elements.temperatureSlider.value).toFixed(1);
      });
      elements.soilMoistureSlider.addEventListener("input", () => {
        elements.soilMoistureValue.textContent = elements.soilMoistureSlider.value;
      });
      elements.tankLevelSlider.addEventListener("input", () => {
        elements.tankLevelValue.textContent = elements.tankLevelSlider.value;
      });
      elements.sendBtn.addEventListener("click", sendTemperature);
      elements.refreshEventsBtn.addEventListener("click", refreshEvents);

      elements.temperatureValue.textContent = parseFloat(elements.temperatureSlider.value).toFixed(1);
      elements.soilMoistureValue.textContent = elements.soilMoistureSlider.value;
      elements.tankLevelValue.textContent = elements.tankLevelSlider.value;

      refreshEvents();
    })();
  </script>
</body>
</html>
