<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgriControl Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #eef2ec;
    --bg-accent: #e4ede4;
    --panel: #ffffff;
    --panel-border: rgba(24, 42, 47, 0.08);
    --ink: #16262b;
    --muted: #62767b;
    --line: #dfe7e2;
    --teal: #1c6b74;
    --teal-soft: #e3f1f1;
    --amber: #b3711f;
    --amber-soft: #fdf1de;
    --blue: #2f5fa8;
    --blue-soft: #e8eefa;
    --purple: #6a4d9c;
    --purple-soft: #efe9f7;
    --green: #2f7d4a;
    --green-soft: #e4f4e8;
    --red: #ad3b40;
    --red-soft: #faeaea;
    --shadow: 0 1px 2px rgba(16, 30, 33, 0.06), 0 8px 24px -12px rgba(16, 30, 33, 0.18);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1614;
      --bg-accent: #131b19;
      --panel: #182422;
      --panel-border: rgba(255, 255, 255, 0.08);
      --ink: #eaf2ee;
      --muted: #93a7a1;
      --line: #26332f;
      --teal: #5fc2c9;
      --teal-soft: #16302f;
      --amber: #e4a75c;
      --amber-soft: #322717;
      --blue: #8fb3ec;
      --blue-soft: #182236;
      --purple: #c1a8ec;
      --purple-soft: #251d34;
      --green: #7fd39a;
      --green-soft: #16301f;
      --red: #f0999c;
      --red-soft: #341a1b;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 480px at 12% -10%, var(--bg-accent), transparent),
      var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    padding: 28px 20px 60px;
  }
  a { color: var(--teal); }
  code {
    background: var(--panel-border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.85em;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
  }

  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 20px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 {
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--teal), var(--green));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex: none;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
  }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 20px 14px 48px; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 20px 20px 22px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent, var(--teal));
  }
  .panel--climate { --accent: var(--amber); }
  .panel--actuators { --accent: var(--purple); }

  .panel h2 {
    font-size: 0.95rem;
    font-weight: 700;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    letter-spacing: -0.005em;
  }
  .panel h2 .icon {
    width: 18px;
    height: 18px;
    color: var(--accent, var(--teal));
    flex: none;
  }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 8px;
    font: inherit;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus, .btn:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 1px;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent, var(--teal)); }
  input[type="checkbox"] { accent-color: var(--accent, var(--teal)); }
  .row { margin-bottom: 13px; }
  .row:last-child { margin-bottom: 0; }
  .inline-checkbox { display: flex; align-items: center; gap: 6px; font-size: 0.88rem; color: var(--ink); }
  .inline-checkbox + .inline-checkbox { margin-top: 8px; }

  .btn {
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font: inherit;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.92; }
  .btn:active { transform: translateY(1px); }
  .btn.secondary { background: var(--bg-accent); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

  .temp-value { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
  .temp-value .unit { font-size: 1rem; font-weight: 600; color: var(--muted); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 999px;
    padding: 3px 11px;
    font-size: 0.76rem;
    font-weight: 700;
  }
  .badge.ok { background: var(--green-soft); color: var(--green); }
  .badge.warn { background: var(--amber-soft); color: var(--amber); }
  .badge.err { background: var(--red-soft); color: var(--red); }
  .badge.idle { background: var(--bg-accent); color: var(--muted); }

  .response-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
    margin: 14px 0 0;
    font-size: 0.86rem;
  }
  .response-grid dt { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
  .response-grid dd { margin: 0; font-weight: 700; }

  .window-scene {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 22px;
    padding: 10px 0 18px;
    flex-wrap: wrap;
  }
  .actuator-visual {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .actuator-caption { font-size: 0.82rem; color: var(--ink); }

  .window-frame {
    width: 78px;
    height: 78px;
    border: 4px solid var(--ink);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #cfe9ec, #e8f4e8);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark) {
    .window-frame { background: linear-gradient(180deg, #223b3d, #1c2f27); }
  }
  .window-sash {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(120, 150, 152, 0.55);
    border-right: 3px solid var(--ink);
    transform-origin: left center;
    transition: transform 0.4s ease;
    backdrop-filter: blur(1px);
  }

  .fan-icon, .pump-icon {
    width: 78px;
    height: 78px;
    flex: none;
  }
  .fan-icon {
    fill: var(--line);
    transform-origin: center;
    transition: fill 0.3s ease;
  }
  .fan-icon.on { fill: var(--green); }
  .fan-hub { fill: var(--panel); }

  .fan-icon.on { animation: fan-spin 1s linear infinite; }
  @keyframes fan-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .pump-nozzle { fill: var(--line); transition: fill 0.3s ease; }
  .pump-icon.on .pump-nozzle { fill: var(--green); }

  .pump-drop { fill: var(--blue); opacity: 0; transform-origin: center; }
  .pump-icon.on .pump-drop-1 { animation: pump-spray-left 1.1s ease-out infinite; }
  .pump-icon.on .pump-drop-2 { animation: pump-spray-center 1.1s ease-out infinite 0.28s; }
  .pump-icon.on .pump-drop-3 { animation: pump-spray-right 1.1s ease-out infinite 0.56s; }

  @keyframes pump-spray-left {
    0% { transform: translate(0, 0); opacity: 0; }
    18% { opacity: 1; }
    100% { transform: translate(-7px, -12px); opacity: 0; }
  }
  @keyframes pump-spray-center {
    0% { transform: translate(0, 0); opacity: 0; }
    18% { opacity: 1; }
    100% { transform: translate(0, -14px); opacity: 0; }
  }
  @keyframes pump-spray-right {
    0% { transform: translate(0, 0); opacity: 0; }
    18% { opacity: 1; }
    100% { transform: translate(7px, -12px); opacity: 0; }
  }

  .reasons { font-size: 0.82rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1>
          <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69s6 6.13 6 10.19a6 6 0 1 1-12 0c0-4.06 6-10.19 6-10.19Z"/></svg>
          </span>
          AgriControl Simulator
        </h1>
      </div>
    </div>

    <div class="grid">
      <section class="panel panel--climate" id="sensorsPanel">
        <h2>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
          Sensors
        </h2>
        <div class="row">
          <label for="temperatureSlider">Temperature</label>
          <input type="range" id="temperatureSlider" min="-10" max="50" step="0.5" value="25" />
          <div class="temp-value"><span id="temperatureValue">25.0</span><span class="unit">&deg;C</span></div>
        </div>
        <div class="row">
          <label for="soilMoistureSlider">Soil moisture <span id="soilMoistureValue">45</span>%</label>
          <input type="range" id="soilMoistureSlider" min="0" max="100" step="1" value="45" />
        </div>
        <div class="row">
          <label for="tankLevelSlider">Tank level <span id="tankLevelValue">70</span>%</label>
          <input type="range" id="tankLevelSlider" min="0" max="100" step="1" value="70" />
        </div>
        <label class="inline-checkbox" style="margin-bottom: 14px;">
          <input type="checkbox" id="liveUpdateCheckbox" /> Update live while dragging
        </label>
        <div class="btn-row">
          <button class="btn" id="sendBtn" type="button">Send to ESP</button>
        </div>
      </section>

      <section class="panel panel--actuators" id="actuatorsPanel">
        <h2>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>
          Actuators
        </h2>
        <span class="badge idle" id="responseBadge">No response yet</span>
        <div class="window-scene">
          <div class="actuator-visual">
            <div class="window-frame">
              <div class="window-sash" id="windowSash" style="transform: rotateY(0deg);"></div>
            </div>
            <span class="actuator-caption">Window</span>
          </div>
          <div class="actuator-visual">
            <svg class="fan-icon off" id="fanIndicator" viewBox="0 0 24 24" aria-hidden="true">
              <ellipse cx="12" cy="7" rx="2.2" ry="4.5"/>
              <ellipse cx="12" cy="7" rx="2.2" ry="4.5" transform="rotate(120 12 12)"/>
              <ellipse cx="12" cy="7" rx="2.2" ry="4.5" transform="rotate(240 12 12)"/>
              <circle cx="12" cy="12" r="1.6" class="fan-hub"/>
            </svg>
            <span class="actuator-caption" id="fanLabel">Fan: off</span>
          </div>
          <div class="actuator-visual">
            <svg class="pump-icon off" id="pumpIndicator" viewBox="0 0 24 24" aria-hidden="true">
              <path class="pump-nozzle" d="M9 22h6l-1-4h-4l-1 4Z"/>
              <rect class="pump-nozzle" x="10" y="13" width="4" height="6" rx="1"/>
              <circle class="pump-drop pump-drop-1" cx="12" cy="12" r="1.3"/>
              <circle class="pump-drop pump-drop-2" cx="12" cy="12" r="1.1"/>
              <circle class="pump-drop pump-drop-3" cx="12" cy="12" r="1.3"/>
            </svg>
            <span class="actuator-caption" id="pumpLabel">Pump: off</span>
          </div>
        </div>
        <dl class="response-grid" id="responseGrid"></dl>
        <div class="reasons" id="responseReasons"></div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // The bridge this page talks to -- not user-configurable, so the
      // page works immediately with no setup for anyone opening it.
      const BRIDGE_URL = "https://phyowaisoe.com/agricontrol/bridge";

      const elements = {
        temperatureSlider: document.getElementById("temperatureSlider"),
        temperatureValue: document.getElementById("temperatureValue"),
        sendBtn: document.getElementById("sendBtn"),
        responseBadge: document.getElementById("responseBadge"),
        responseGrid: document.getElementById("responseGrid"),
        responseReasons: document.getElementById("responseReasons"),
        windowSash: document.getElementById("windowSash"),
        fanIndicator: document.getElementById("fanIndicator"),
        fanLabel: document.getElementById("fanLabel"),
        pumpIndicator: document.getElementById("pumpIndicator"),
        pumpLabel: document.getElementById("pumpLabel"),
        soilMoistureSlider: document.getElementById("soilMoistureSlider"),
        soilMoistureValue: document.getElementById("soilMoistureValue"),
        tankLevelSlider: document.getElementById("tankLevelSlider"),
        tankLevelValue: document.getElementById("tankLevelValue"),
        liveUpdateCheckbox: document.getElementById("liveUpdateCheckbox")
      };

      function bridgeUrl() {
        return BRIDGE_URL;
      }

      function setBadge(el, text, tone) {
        el.textContent = text;
        el.className = "badge " + tone;
      }

      // Roadmap task 46: virtual window. 10deg (closed) -> 0% open,
      // 170deg (fully open) -> 100% open, matching
      // logic/decision.py / firmware/include/decision.h's angle range.
      function updateWindowVisual(windowAngleDeg, fanOn, pumpOn) {
        const minDeg = 10;
        const maxDeg = 170;
        const clamped = Math.max(minDeg, Math.min(maxDeg, windowAngleDeg));
        const openFraction = (clamped - minDeg) / (maxDeg - minDeg);
        const rotation = openFraction * 110; // degrees of visual swing
        elements.windowSash.style.transform = `rotateY(${rotation}deg)`;

        // setAttribute, not .className -- on an SVG element, .className
        // is a read-only SVGAnimatedString in some browsers, not a plain
        // string like on an HTML element, so a direct assignment doesn't
        // reliably work across browsers the way it does for windowSash.
        elements.fanIndicator.setAttribute("class", "fan-icon " + (fanOn ? "on" : "off"));
        elements.fanLabel.textContent = "Fan: " + (fanOn ? "on" : "off");

        elements.pumpIndicator.setAttribute("class", "pump-icon " + (pumpOn ? "on" : "off"));
        elements.pumpLabel.textContent = "Pump: " + (pumpOn ? "on" : "off");
      }

      function renderResponse(body) {
        setBadge(elements.responseBadge, body.mode || "unknown", body.mode === "automatic" ? "ok" : "warn");
        elements.responseGrid.innerHTML = "";
        const rows = [
          ["Sequence", body.sequence],
          ["Alarm level", body.alarm_level],
          ["Fan", body.commands && body.commands.fan ? "on" : "off"],
          ["Pump", body.commands && body.commands.pump ? "on" : "off"],
          ["Window angle", body.commands ? body.commands.window_angle + "°" : "-"]
        ];
        for (const [label, value] of rows) {
          const dt = document.createElement("dt");
          dt.textContent = label;
          const dd = document.createElement("dd");
          dd.textContent = value === undefined || value === null ? "-" : String(value);
          elements.responseGrid.appendChild(dt);
          elements.responseGrid.appendChild(dd);
        }
        elements.responseReasons.textContent = (body.reasons || []).join(" ");
        if (body.commands) {
          updateWindowVisual(body.commands.window_angle, Boolean(body.commands.fan), Boolean(body.commands.pump));
        }
      }

      function renderError(message) {
        setBadge(elements.responseBadge, "Error", "err");
        elements.responseGrid.innerHTML = "";
        elements.responseReasons.textContent = message;
      }

      // Roadmap tasks 49-51: build the request body. rain has no UI
      // control on this page, but is still sent as a fixed 0 (not
      // raining) rather than omitted -- found the hard way (2026-08-06):
      // firmware/include/canonical.h's staleness tracking is per-sensor,
      // so once a session has ever reported a rain reading, that sensor
      // must keep being refreshed or it goes stale forever, which
      // permanently forces the safety supervisor's DATA-STALE override
      // (fan/pump/window all held safe) regardless of the other three
      // readings being perfectly fresh. Omitting the field entirely is
      // only safe for a sensor that was NEVER reported in the first
      // place, not one this page used to send and then stopped.
      function buildSensorPayload() {
        return {
          temperature: parseFloat(elements.temperatureSlider.value),
          soil_moisture: parseFloat(elements.soilMoistureSlider.value),
          water_level_percent: parseFloat(elements.tankLevelSlider.value),
          rain: 0
        };
      }

      // Guards against request pileup: each network round trip (bridge ->
      // MQTT -> ESP -> MQTT -> bridge) takes real time, so firing a fresh
      // one per "input" event while fast-dragging a slider queued up far
      // faster than they could resolve, and the page spent many seconds
      // "catching up" after the user had already stopped. requestSend()
      // only ever keeps one request in flight; extra calls while one is
      // pending just mark that another is needed once it finishes, which
      // then reads whatever the sliders currently show -- not a stale
      // snapshot from when it was queued.
      let sendInFlight = false;
      let sendQueued = false;

      async function requestSend() {
        if (sendInFlight) {
          sendQueued = true;
          return;
        }
        sendInFlight = true;
        await sendTemperature();
        sendInFlight = false;
        if (sendQueued) {
          sendQueued = false;
          requestSend();
        }
      }

      async function sendTemperature() {
        try {
          const res = await fetch(bridgeUrl() + "/api/temperature", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(buildSensorPayload())
          });
          const body = await res.json();
          if (!res.ok) {
            renderError(body.detail || "Request failed");
            return;
          }
          renderResponse(body);
        } catch (error) {
          renderError("Could not reach the bridge: " + error.message);
        }
      }


      elements.temperatureSlider.addEventListener("input", () => {
        elements.temperatureValue.textContent = parseFloat(elements.temperatureSlider.value).toFixed(1);
        if (elements.liveUpdateCheckbox.checked) {
          requestSend();
        }
      });
      elements.soilMoistureSlider.addEventListener("input", () => {
        elements.soilMoistureValue.textContent = elements.soilMoistureSlider.value;
        if (elements.liveUpdateCheckbox.checked) {
          requestSend();
        }
      });
      elements.tankLevelSlider.addEventListener("input", () => {
        elements.tankLevelValue.textContent = elements.tankLevelSlider.value;
        if (elements.liveUpdateCheckbox.checked) {
          requestSend();
        }
      });
      elements.sendBtn.addEventListener("click", requestSend);

      elements.temperatureValue.textContent = parseFloat(elements.temperatureSlider.value).toFixed(1);
      elements.soilMoistureValue.textContent = elements.soilMoistureSlider.value;
      elements.tankLevelValue.textContent = elements.tankLevelSlider.value;

      // Keeps the ESP's view of these readings continuously fresh while
      // this page stays open. Necessary, not cosmetic: firmware/include/
      // canonical.h's staleness timeout is 10s, and Gate A's "recovery
      // requires stable communication" needs several consecutive fresh
      // messages in a row -- a real user sending a reading only every
      // so often (more than 10s apart) would re-trigger the safety
      // supervisor's DATA-STALE override on nearly every interaction,
      // forcing fan/pump/window off each time even though nothing is
      // actually wrong. Resending the current values every 4s (well
      // under the 10s timeout) makes this page behave like the
      // continuously-connected sensor the blueprint describes, without
      // changing any tested firmware/safety behavior.
      setInterval(requestSend, 4000);
    })();
  </script>
</body>
</html>
