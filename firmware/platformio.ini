; PlatformIO project for the confirmed AgriControl board: ESP32-C3M-TRY
; (MicroFan), module ESP32-C3-MINI-1 (RISC-V, 4MB flash).
;
; "board = esp32-c3-devkitm-1" is Espressif's generic PlatformIO board
; definition for the ESP32-C3-MINI-1 module. ESP32-C3M-TRY is not itself a
; registered PlatformIO board, so this is the closest chip-accurate match;
; flash size is pinned explicitly below rather than trusting the devkit
; default. Verify with `pio run` before relying on it.
;
; Each test_*.cpp is its own PlatformIO environment (via build_src_filter)
; so only one file's setup()/loop() is linked per build. See README.md for
; the full workflow.

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_size = 4MB
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    olikraus/U8g2 @ ^2.35.19
    madhephaestus/ESP32Servo @ ^3.0.5
    bblanchon/ArduinoJson @ ^7.0.0

[env:main]
build_src_filter = +<main.cpp> -<*>

[env:test_oled]
build_src_filter = +<test_oled.cpp> -<*>

[env:test_neopixel]
build_src_filter = +<test_neopixel.cpp> -<*>

[env:test_buzzer]
build_src_filter = +<test_buzzer.cpp> -<*>

[env:test_servo]
build_src_filter = +<test_servo.cpp> -<*>

[env:test_all_outputs]
build_src_filter = +<test_all_outputs.cpp> -<*>

; Stage 4 (roadmap tasks 24-30): async runtime, shared state, events,
; stale-data detection, recovery, HTTP server, and validation limits.
; Requires include/secrets.h (copy include/secrets.h.example and fill in
; real WiFi credentials -- gitignored, never commit it).
[env:runtime]
build_src_filter = +<runtime.cpp> -<*>

; Stage 5 (roadmap tasks 31/33-37): first vertical slice, temperature only.
; Builds on env:runtime by adding the decision engine, the safety
; supervisor, servo output, OLED display, and a full JSON response. Also
; needs include/secrets.h.
[env:vertical_slice]
build_src_filter = +<vertical_slice.cpp> -<*>

; Stage 7 (roadmap tasks 49-57): irrigation slice. Builds on
; env:vertical_slice by adding soil moisture, tank level, rain, pump
; hysteresis, low-tank protection, a NeoPixel status color, and a buzzer
; tone on alarm changes. Pump is reported, not physically driven -- no
; pump pin has been assigned. Also needs include/secrets.h.
[env:irrigation_slice]
build_src_filter = +<irrigation_slice.cpp> -<*>

; Ad-hoc MQTT hardware-verification harness -- NOT a numbered blueprint
; task and NOT AgriControl's chosen architecture. See
; src/mqtt_test_harness.cpp's file header for why this exists (an AI agent
; with no local-network access has no way to reach env:irrigation_slice's
; local HTTP server) and what does/doesn't change (same irrigation.h logic,
; MQTT is a transport swap only). Needs include/secrets.h (WiFi) and
; include/mqtt_secrets.h (MQTT broker identity, copy
; mqtt_secrets.h.example).
[env:mqtt_test_harness]
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8
build_src_filter = +<mqtt_test_harness.cpp> -<*>
